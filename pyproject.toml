[project]
name = "eve-booking"
version = "0.1.0"
description = "Diagnostic bookings and simulated payments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "sqlalchemy>=2.1.2",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "uvicorn>=0.54.0",
    "email-validator>=2.3.0",
    "redis>=8.1.0",
    "celery>=5.6.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
