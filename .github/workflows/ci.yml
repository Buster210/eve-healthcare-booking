name: ci
"on":
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
          POSTGRES_DB: eve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://eve:eve@localhost:5432/eve_test
          TEST_REDIS_URL: redis://localhost:6379/2
          JWT_SECRET: test-only-jwt-secret-at-least-32-characters
          WEBHOOK_SECRET: test-only-webhook-secret-at-least-32-characters
